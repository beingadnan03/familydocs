<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Family Documents</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14182b;--mut:#667085;--pri:#1e3a8a;--on:#fff;--bd:#e2e6f0;--ok:#067647;--okb:#d1fadf;--warn:#93370d;--warnb:#fef0c7;--bad:#b42318;--badb:#fee4e2;--non:#475467;--nonb:#eaecf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1220;--card:#1a2033;--text:#eef0f8;--mut:#9aa3bb;--pri:#6f8cff;--on:#0e1220;--bd:#2b3350;--ok:#6ce9a6;--okb:#12382a;--warn:#fec84b;--warnb:#3d2e0a;--bad:#fda29b;--badb:#40181a;--non:#c0c6d8;--nonb:#2b3350;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.top{background:var(--pri);color:var(--on);padding:14px 16px;font-weight:700;font-size:18px}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:13px;margin-top:2px}
h2{font-size:18px;margin:6px 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
input[type=checkbox]{width:auto;margin-right:8px}
button{padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--on);font-size:16px;font-weight:600;width:100%;margin-top:12px;cursor:pointer}
button.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.del{background:var(--badb);color:var(--bad)}
button:disabled{opacity:.6}
.b{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.valid{background:var(--okb);color:var(--ok)}.soon{background:var(--warnb);color:var(--warn)}.exp{background:var(--badb);color:var(--bad)}.none{background:var(--nonb);color:var(--non)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer}
.stat b{font-size:26px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:14px 4px;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
nav a.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);width:100%;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:12px;right:12px;bottom:90px;background:#222;color:#fff;padding:12px;border-radius:12px;z-index:9;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.link{color:var(--pri);text-align:center;margin-top:14px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const URL_='https://wfaayjxavwhywxuokvcg.supabase.co',KEY='sb_publishable_OBY7pujYjGrZiND5VBvKwQ_y-fmXDN0';
const sb=supabase.createClient(URL_,KEY);
const CATS=['Aadhaar Card','PAN Card','Passport','Voter ID','Driving Licence','Vehicle RC','Insurance','Health Card','Birth Certificate','Marriage Certificate','Education Certificate','Bank Document','Property Document','Other'];
const RELS=['Self','Father','Mother','Husband','Wife','Son','Daughter','Brother','Sister','Grandfather','Grandmother','Other'];
const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'};
let user=null,uid='',members=[],docs=[],tab='home',mode='login',busy=false,modal='',f={status:'',member:'',q:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3800)}
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function status(exp){if(!exp)return{k:'none',t:'No Expiry Date',c:'none'};const t=today();if(exp<t)return{k:'expired',t:'Expired',c:'exp'};
 return (Date.parse(exp)-Date.parse(t))/864e5<=30?{k:'soon',t:'Expiring Soon',c:'soon'}:{k:'valid',t:'Valid',c:'valid'}}
const mname=id=>(members.find(m=>m.id===id)||{}).full_name||'';
const dcat=d=>d.category==='Other'?(d.custom_category||'Other'):d.category;
const mask=n=>n?'•••• '+String(n).slice(-4):'';
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');

async function loadAll(){
 const [m,d]=await Promise.all([sb.from('family_members').select('*').order('full_name'),sb.from('documents').select('*,document_files(*)').order('created_at',{ascending:false})]);
 if(m.error||d.error)throw new Error('Could not load your data. Check your connection and try again.');
 members=m.data;docs=d.data}

async function callAuth(ev){
 ev.preventDefault();if(busy)return;
 const id=$('#uid').value.trim(),pin=$('#pin').value,reg=mode==='register';
 if(!/^\d{10,15}$/.test(id))return toast('Enter a valid User ID (10 to 15 digits).');
 if(!/^\d{4}$/.test(pin))return toast('PIN must be exactly 4 digits.');
 if(reg){if(pin!==$('#pin2').value)return toast('PINs do not match.');if(!$('#cons').checked)return toast('Please accept the Privacy Policy and Terms.')}
 busy=true;const b=$('#sub');b.disabled=true;const old=b.textContent;b.textContent='Please wait…';
 try{
  const r=await fetch(URL_+'/functions/v1/auth',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({action:mode,userId:id,pin,consent:reg?true:undefined})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Could not sign in. Please try again.');
  const s=await sb.auth.setSession({access_token:d.session.access_token,refresh_token:d.session.refresh_token});
  if(s.error)throw new Error('Could not start your session.');
  uid=d.user.id;user=d.user.userId;await loadAll();tab='home';busy=false;render();
 }catch(e){busy=false;b.disabled=false;b.textContent=old;toast(e.message||'Something went wrong.')}
}

function authView(){const reg=mode==='register';return `<div class="top">Family Documents</div><div class="wrap"><div class="card"><h2>${reg?'Create account':'Login'}</h2>
<form onsubmit="callAuth(event)"><label>User ID (phone number)</label><input id="uid" inputmode="numeric" autocomplete="username" maxlength="15">
<label>4-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
${reg?`<label>Confirm PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
<label style="display:flex;align-items:flex-start"><input id="cons" type="checkbox">I accept the Privacy Policy and Terms. I understand there is NO PIN recovery.</label>`:''}
<label style="display:flex"><input type="checkbox" onchange="$('#pin').type=this.checked?'text':'password'">Show PIN</label>
<button id="sub">${reg?'Register':'Login'}</button></form>
<div class="link" onclick="mode='${reg?'login':'register'}';render()">${reg?'Already registered? Login':'New here? Create account'}</div></div>
<div class="mut" style="text-align:center">Produced By Mohd Adnan</div></div>`}

function docCard(d){const s=status(d.expiry_date);return `<div class="card row" onclick="openDoc('${d.id}')"><div><b>${esc(d.display_name)}</b><div class="mut">${esc(mname(d.family_member_id))} · ${esc(dcat(d))}${d.expiry_date?' · '+esc(d.expiry_date):''}</div></div><span class="b ${s.c}">${s.t}</span></div>`}

function homeView(){const c={valid:0,soon:0,expired:0};docs.forEach(d=>{const k=status(d.expiry_date).k;if(c[k]!==undefined)c[k]++});
 const alert=docs.filter(d=>['soon','expired'].includes(status(d.expiry_date).k)).sort((a,b)=>a.expiry_date<b.expiry_date?-1:1);
 return `<div class="grid"><div class="stat" onclick="tab='family';render()"><b>${members.length}</b>Family members</div><div class="stat" onclick="go('')"><b>${docs.length}</b>Documents</div>
<div class="stat" onclick="go('valid')"><b>${c.valid}</b>Valid</div><div class="stat" onclick="go('soon')"><b>${c.soon}</b>Expiring soon</div><div class="stat" onclick="go('expired')"><b>${c.expired}</b>Expired</div></div>
<h2>Needs attention</h2>${alert.length?alert.map(docCard).join(''):'<div class="empty">Nothing expiring. 🎉</div>'}`}
function go(s){f={status:s,member:'',q:''};tab='docs';render()}

function familyView(){return `<div class="row"><h2>Family</h2><div style="width:140px"><button style="margin:0;padding:10px" onclick="modal='member';render()">+ Add member</button></div></div>
${members.length?members.map(m=>{const n=docs.filter(d=>d.family_member_id===m.id).length;return `<div class="card row" onclick="f={status:'',member:'${m.id}',q:''};tab='docs';render()"><div><b>${esc(m.full_name)}</b><div class="mut">${esc(m.relationship==='Other'?m.custom_relationship:m.relationship)} · ${n} document${n===1?'':'s'}</div></div><span class="b none" onclick="event.stopPropagation();delMember('${m.id}')">Delete</span></div>`}).join(''):'<div class="empty">No family members yet. Tap “Add member”.</div>'}`}

function docsView(){const q=f.q.toLowerCase();
 const list=docs.filter(d=>(!f.status||status(d.expiry_date).k===f.status)&&(!f.member||d.family_member_id===f.member)&&(!q||[d.display_name,dcat(d),d.document_number,d.notes,mname(d.family_member_id)].some(x=>String(x||'').toLowerCase().includes(q))));
 return `<div class="row"><h2>Documents</h2><div style="width:140px"><button style="margin:0;padding:10px" onclick="if(!members.length)return toast('Add a family member first.');modal='doc';render()">+ Add document</button></div></div>
<input placeholder="Search name, category, number, notes…" value="${esc(f.q)}" oninput="f.q=this.value;sd()">
<div class="grid" style="margin-top:8px"><select onchange="f.status=this.value;render()"><option value="">All statuses</option>${[['valid','Valid'],['soon','Expiring Soon'],['expired','Expired'],['none','No Expiry Date']].map(x=>`<option value="${x[0]}" ${f.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>
<select onchange="f.member=this.value;render()"><option value="">All members</option>${members.map(m=>`<option value="${m.id}" ${f.member===m.id?'selected':''}>${esc(m.full_name)}</option>`).join('')}</select></div>
<div id="dl">${list.length?list.map(docCard).join(''):'<div class="empty">No documents found.</div>'}</div>`}
let sdT;function sd(){clearTimeout(sdT);sdT=setTimeout(()=>{const q=f.q;render();const i=document.querySelector('input[placeholder^=Search]');if(i){i.focus();i.setSelectionRange(q.length,q.length)}},300)}

function settingsView(){return `<h2>Settings</h2><div class="card"><div class="mut">Signed in as</div><b>${esc(user)}</b></div>
<div class="card"><b>Backup</b><div class="mut">Exports records (names, dates, numbers) only. It does NOT include your images or PDFs. The file is sensitive, keep it safe.</div><button class="alt" onclick="exportJson()">Export records (JSON)</button></div>
<div class="card"><b>Privacy</b><div class="mut">Documents are stored in a private bucket; only your account can open them. There is no PIN recovery: if you forget your PIN, access cannot be restored. Back up regularly.</div></div>
<button class="del" onclick="logout()">Logout</button>`}

function exportJson(){const o={exported_at:new Date().toISOString(),family_members:members,documents:docs.map(({document_files,...d})=>({...d,files:(document_files||[]).map(x=>({kind:x.kind,storage_path:x.storage_path,mime_type:x.mime_type,size_bytes:x.size_bytes}))}))};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='family-docs-records-'+today()+'.json';a.click()}
async function logout(){if(!confirm('Logout?'))return;await sb.auth.signOut();user=null;uid='';members=[];docs=[];modal='';render()}

function memberModal(){return `<div class="modal" onclick="if(event.target===this){modal='';render()}"><div class="sheet"><h2>Add family member</h2><form onsubmit="saveMember(event)">
<label>Full name</label><input name="name" maxlength="100"><label>Relationship</label><select name="rel" onchange="this.form.crel.style.display=this.value==='Other'?'block':'none'">${opts(RELS)}</select>
<input name="crel" placeholder="Custom relationship" maxlength="50" style="display:none;margin-top:8px"><label>Date of birth (optional)</label><input name="dob" type="date"><label>Notes (optional)</label><textarea name="notes" maxlength="1000"></textarea>
<button id="sv">Save</button><button type="button" class="alt" onclick="modal='';render()">Cancel</button></form></div></div>`}
async function saveMember(ev){ev.preventDefault();if(busy)return;const F=ev.target,v=n=>F[n].value.trim();
 if(!v('name'))return toast('Enter a name.');if(F.rel.value==='Other'&&!v('crel'))return toast('Enter the relationship.');
 busy=true;$('#sv').disabled=true;
 const r=await sb.from('family_members').insert({full_name:v('name'),relationship:F.rel.value,custom_relationship:F.rel.value==='Other'?v('crel'):null,date_of_birth:v('dob')||null,notes:v('notes')||null});
 busy=false;if(r.error){$('#sv').disabled=false;return toast('Could not save. Please try again.')}
 modal='';try{await loadAll()}catch(e){toast(e.message)}render()}
async function delMember(id){const m=members.find(x=>x.id===id),ds=docs.filter(d=>d.family_member_id===id);
 if(!confirm(`Delete ${m.full_name}? This also permanently deletes ${ds.length} document(s) and their files.`))return;
 if(!confirm('Are you sure? This cannot be undone.'))return;
 const paths=ds.flatMap(d=>d.document_files.map(x=>x.storage_path));
 if(paths.length){const r=await sb.storage.from('documents').remove(paths);if(r.error)return toast('Could not delete files. Nothing was deleted.')}
 const r=await sb.from('family_members').delete().eq('id',id);if(r.error)return toast('Could not delete. Please try again.');
 try{await loadAll()}catch(e){}render()}

function docModal(){return `<div class="modal" onclick="if(event.target===this){modal='';render()}"><div class="sheet"><h2>Add document</h2><form onsubmit="saveDoc(event)">
<label>Family member</label><select name="member">${members.map(m=>`<option value="${m.id}" ${m.id===f.member?'selected':''}>${esc(m.full_name)}</option>`).join('')}</select>
<label>Category</label><select name="cat" onchange="this.form.ccat.style.display=this.value==='Other'?'block':'none'">${opts(CATS)}</select>
<input name="ccat" placeholder="Custom category" maxlength="50" style="display:none;margin-top:8px">
<label>Document name</label><input name="name" maxlength="120"><label>Document number (optional)</label><input name="num" maxlength="50" autocomplete="off">
<label>Issue date (optional)</label><input name="iss" type="date"><label>Expiry date (optional)</label><input name="exp" type="date">
<label>Front image (optional)</label><input name="front" type="file" accept="image/jpeg,image/png,image/webp">
<label>Back image (optional)</label><input name="back" type="file" accept="image/jpeg,image/png,image/webp">
<label>PDF (optional)</label><input name="pdf" type="file" accept="application/pdf">
<label>Notes (optional)</label><textarea name="notes" maxlength="1000"></textarea>
<div class="mut">Max 10 MB per file.</div><button id="sv">Save</button><button type="button" class="alt" onclick="modal='';render()">Cancel</button></form></div></div>`}
async function saveDoc(ev){ev.preventDefault();if(busy)return;const F=ev.target,v=n=>F[n].value.trim();
 const files={front:F.front.files[0],back:F.back.files[0],pdf:F.pdf.files[0]};
 if(!v('name'))return toast('Enter a document name.');if(F.cat.value==='Other'&&!v('ccat'))return toast('Enter the category.');
 if(v('iss')&&v('exp')&&v('exp')<v('iss'))return toast('Expiry date is before the issue date.');
 for(const [k,x] of Object.entries(files)){if(!x)continue;if(!EXT[x.type]||(k==='pdf')!==(x.type==='application/pdf'))return toast('Unsupported file type for '+k+'.');if(x.size>10485760)return toast('File too large (max 10 MB): '+k)}
 busy=true;$('#sv').disabled=true;$('#sv').textContent='Uploading…';const up=[];let id=null;
 try{
  const r=await sb.from('documents').insert({family_member_id:v('member'),category:F.cat.value,custom_category:F.cat.value==='Other'?v('ccat'):null,display_name:v('name'),document_number:v('num')||null,issue_date:v('iss')||null,expiry_date:v('exp')||null,notes:v('notes')||null}).select('id').single();
  if(r.error)throw r.error;id=r.data.id;
  for(const [k,x] of Object.entries(files)){if(!x)continue;const p=`${uid}/${id}/${crypto.randomUUID()}.${EXT[x.type]}`;
   const u=await sb.storage.from('documents').upload(p,x,{contentType:x.type});if(u.error)throw u.error;up.push(p);
   const m=await sb.from('document_files').insert({document_id:id,kind:k,storage_path:p,mime_type:x.type,size_bytes:x.size});if(m.error)throw m.error}
  busy=false;modal='';await loadAll();render();toast('Saved ✓');
 }catch(e){
  if(up.length)await sb.storage.from('documents').remove(up);if(id)await sb.from('documents').delete().eq('id',id);
  busy=false;$('#sv').disabled=false;$('#sv').textContent='Save';toast('Could not save. Nothing was saved, please try again.')}}

function openDoc(id){modal='d:'+id;render()}
function detailModal(id){const d=docs.find(x=>x.id===id);if(!d){return ''}const s=status(d.expiry_date);
 const fl=d.document_files||[];const lab={front:'Front image',back:'Back image',pdf:'PDF'};
 return `<div class="modal" onclick="if(event.target===this){modal='';render()}"><div class="sheet"><div class="row"><h2>${esc(d.display_name)}</h2><span class="b ${s.c}">${s.t}</span></div>
<div class="card"><div class="mut">Member</div>${esc(mname(d.family_member_id))}<div class="mut">Category</div>${esc(dcat(d))}
${d.document_number?`<div class="mut">Number</div>${esc(mask(d.document_number))} <span class="mut" style="cursor:pointer;color:var(--pri)" onclick="this.textContent=' ${esc(d.document_number)}'">show</span>`:''}
<div class="mut">Issued</div>${esc(d.issue_date||'—')}<div class="mut">Expires</div>${esc(d.expiry_date||'—')}${d.notes?`<div class="mut">Notes</div>${esc(d.notes)}`:''}</div>
${fl.map(x=>`<button class="alt" onclick="viewFile('${esc(x.storage_path)}')">Open ${lab[x.kind]}</button>`).join('')||'<div class="mut">No files attached.</div>'}
<button class="del" onclick="delDoc('${d.id}')">Delete document</button><button class="alt" onclick="modal='';render()">Close</button></div></div>`}
async function viewFile(p){const w=window.open('','_blank');const r=await sb.storage.from('documents').createSignedUrl(p,120);
 if(r.error||!r.data){if(w)w.close();return toast('File not available. Please retry.')}if(w)w.location=r.data.signedUrl;else location.href=r.data.signedUrl}
async function delDoc(id){const d=docs.find(x=>x.id===id);if(!confirm(`Delete “${d.display_name}” and its files? This cannot be undone.`))return;
 const paths=(d.document_files||[]).map(x=>x.storage_path);
 if(paths.length){const r=await sb.storage.from('documents').remove(paths);if(r.error)return toast('Could not delete files. Nothing was deleted.')}
 const r=await sb.from('documents').delete().eq('id',id);if(r.error)return toast('Could not delete. Please try again.');
 modal='';try{await loadAll()}catch(e){}render()}

function render(){const A=$('#app');
 if(!user){A.innerHTML=authView();return}
 const v={home:homeView,family:familyView,docs:docsView,settings:settingsView}[tab]();
 const nav=[['home','🏠','Home'],['family','👪','Family'],['docs','📄','Documents'],['settings','⚙️','Settings']].map(x=>`<a class="${tab===x[0]?'on':''}" onclick="if('${x[0]}'==='docs'&&tab!=='docs')f={status:'',member:'',q:''};tab='${x[0]}';render()">${x[1]}<br>${x[2]}</a>`).join('');
 A.innerHTML=`<div class="top">Family Documents</div><div class="wrap">${v}</div><nav>${nav}</nav>`+(modal==='member'?memberModal():modal==='doc'?docModal():modal.startsWith('d:')?detailModal(modal.slice(2)):'')}

(async()=>{
 sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT'&&user){user=null;render()}});
 try{const {data}=await sb.auth.getSession();
  if(data.session){uid=data.session.user.id;const p=await sb.from('profiles').select('user_id').single();if(p.error)throw p.error;user=p.data.user_id;await loadAll()}
 }catch(e){user=null;await sb.auth.signOut().catch(()=>{})}
 render();
})();
</script>
</body>
</html>
